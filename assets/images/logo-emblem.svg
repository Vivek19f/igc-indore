<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0a121e"/>
    </linearGradient>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc2"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7018"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="4" y="4" width="152" height="152" rx="28" fill="url(#emblemBg)" stroke="url(#emblemGold)" stroke-width="2.5" filter="url(#badgeShadow)"/>
  
  <!-- Subtle inner card border -->
  <rect x="9" y="9" width="142" height="142" rx="22" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Top-Left Gold Corner Triangle (as on business card) -->
  <path d="M 9 9 L 9 105 L 105 9 Z" fill="url(#emblemGold)"/>
  <path d="M 12 12 L 12 92 L 92 12 Z" fill="none" stroke="#fff5d9" stroke-width="0.8" stroke-opacity="0.8"/>

  <!-- Letters I G C inside triangle -->
  <g font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" fill="#251a05" text-anchor="middle">
    <text x="32" y="38" font-size="20">I</text>
    <text x="48" y="58" font-size="20">G</text>
    <text x="68" y="78" font-size="20">C</text>
  </g>

  <!-- Bottom-Right Accent Stripes (as on business card) -->
  <path d="M 151 110 L 151 151 L 110 151 Z" fill="url(#emblemGold)"/>
  <path d="M 151 102 L 151 108 L 102 151 L 96 151 Z" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Small star / sparkle emblem in lower left -->
  <g transform="translate(110, 50)" fill="url(#emblemGold)">
    <circle cx="0" cy="0" r="2.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#emblemGold)" stroke-width="1"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#emblemGold)" stroke-width="1"/>
  </g>
</svg>
