<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="igcGold" x1="10%" y1="10%" x2="95%" y2="85%">
      <stop offset="0%" stop-color="#fff8e2"/>
      <stop offset="20%" stop-color="#f6dc92"/>
      <stop offset="50%" stop-color="#d9a842"/>
      <stop offset="80%" stop-color="#af7e1d"/>
      <stop offset="100%" stop-color="#7a4f07"/>
    </linearGradient>

    <!-- Inner Bevel Highlight Gradient -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fdedc4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5a3802" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Clean Drop Shadow for Luxury Depth -->
    <filter id="properTriangleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#070d17" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Proper 3-Sided Triangle: 3 clean straight sides pointing forward/right as on business card -->
  <polygon points="36,24 206,120 36,216" 
           fill="url(#igcGold)" 
           stroke="#7a4f07" 
           stroke-width="2.2" 
           stroke-linejoin="round"
           filter="url(#properTriangleShadow)"/>

  <!-- Inner Refined Bevel Border -->
  <polygon points="48,42 188,120 48,198" 
           fill="none" 
           stroke="url(#goldBevel)" 
           stroke-width="1.8" 
           stroke-linejoin="round"/>

  <!-- Letters I, G, C Stepped Harmoniously Inside the Triangle Away From Borders -->
  <g font-family="'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
     font-weight="900" 
     fill="#0c1624">
    <text x="74" y="94" font-size="24" text-anchor="middle">I</text>
    <text x="96" y="127" font-size="24" text-anchor="middle">G</text>
    <text x="118" y="156" font-size="24" text-anchor="middle">C</text>
  </g>
</svg>
